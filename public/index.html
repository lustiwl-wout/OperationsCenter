<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#00913F"/>
  <title>Operations Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>

  <!-- TU-style top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">TU</div>
      <div class="brand-pill">Operations Center</div>
    </div>

    <div class="overall-pill" id="overall-pill" data-status="healthy">
      <span class="overall-dot"></span>
      <span class="overall-label" id="overall-label">All clear</span>
    </div>

    <div class="bar-right">
      <div class="bar-chip"><span class="mono" id="clock">—</span></div>
      <div class="bar-chip" id="sync-chip"><span class="sync-dot"></span><span id="sync-text">live</span></div>
      <a class="bar-chip bar-chip-link" href="/config.html">Configure</a>
    </div>
  </header>

  <!-- Main stage: topology on the left, incident rail on the right -->
  <main class="stage">
    <section class="topology-wrap">
      <svg id="topology" class="topology" preserveAspectRatio="xMidYMid meet"></svg>
    </section>
    <aside class="rail" id="rail" data-empty="true">
      <div class="rail-head">
        <span class="rail-title">Active incidents</span>
        <span class="rail-count" id="rail-count">0</span>
      </div>
      <div class="rail-list" id="rail-list"></div>
      <div class="rail-empty" id="rail-empty">
        <div class="rail-empty-dot"></div>
        <div class="rail-empty-label">No incidents</div>
      </div>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
