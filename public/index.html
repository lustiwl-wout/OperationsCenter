<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#00913F"/>
  <title>Operations Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>

  <!-- Minimal top bar -->
  <header class="bar">
    <div class="bar-brand">
      <span class="bar-logo">OC</span>
      <span class="bar-name">Operations Center</span>
    </div>
    <div class="bar-status" id="bar-status" data-status="healthy">
      <span class="bar-dot"></span>
      <span id="bar-label">—</span>
    </div>
    <div class="bar-meta">
      <span class="mono" id="clock">—</span>
      <span class="bar-sync mono" id="bar-sync">·</span>
    </div>
  </header>

  <!-- ALL-CLEAR state: shown when overall === healthy -->
  <div class="all-clear" id="all-clear">
    <div class="pulse-ring" aria-hidden="true"></div>
    <div class="all-clear-dot" aria-hidden="true"></div>
    <p class="all-clear-label">All clear</p>
  </div>

  <!-- INCIDENT state: shown when there are any P1 / P2 / P3 alerts -->
  <main class="stage hidden" id="stage">

    <!-- Incident constellation: SVG drawn by JS -->
    <section class="constellation-wrap">
      <canvas id="constellation" aria-label="Incident impact map"></canvas>
    </section>

    <!-- Incident list: minimal — one row per open incident, no body text -->
    <aside class="incident-list" id="incident-list"></aside>

  </main>

  <script src="/app.js"></script>
</body>
</html>
